plugins { id 'com.android.application' }

android {
    namespace 'com.nouralsumude.student'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nouralsumude.student'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
    }

    signingConfigs {
        stableDebug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keyPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
